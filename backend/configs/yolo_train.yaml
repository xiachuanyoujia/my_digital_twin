# YOLOv8-pose 训练超参数配置
# 适用于自定义人物姿态估计模型训练 (知识蒸馏: MediaPipe -> YOLO)

# 模型
model: yolov8n-pose.pt        # 预训练模型 (可选: yolov8s-pose.pt 更准但更慢)
task: pose                    # 任务类型

# 训练参数
epochs: 100                   # 最大训练轮数
imgsz: 640                    # 输入图片尺寸
batch: 16                     # 批次大小 (GPU 16G 显存可用 32)
workers: 4                    # 数据加载线程数
device: auto                  # 设备 (auto / cpu / cuda:0)
lr0: 0.001                    # 初始学习率
lrf: 0.01                     # 最终学习率 = lr0 * lrf
momentum: 0.937               # SGD momentum
weight_decay: 0.0005          # 权重衰减
warmup_epochs: 3              # 热身轮数
warmup_momentum: 0.8          # 热身阶段 momentum
warmup_bias_lr: 0.1           # 热身阶段偏置学习率

# 优化与正则化
patience: 20                  # 早停等待轮数
dropout: 0.0                  # dropout 率
box: 7.5                      # 边界框损失权重
cls: 0.5                      # 分类损失权重
dfl: 1.5                      # DFL 损失权重
pose: 12.0                    # 关键点回归损失权重
kobj: 1.0                     # 关键点 objectness 损失权重
nbs: 64                       # 归一化批次大小
label_smoothing: 0.0          # 标签平滑

# 数据增强
hsv_h: 0.015                  # HSV-Hue 增强
hsv_s: 0.7                    # HSV-Saturation 增强
hsv_v: 0.4                    # HSV-Value 增强
degrees: 10.0                 # 旋转角度范围
translate: 0.1                # 平移比例
scale: 0.5                    # 缩放范围
shear: 2.0                    # 剪切角度
perspective: 0.0              # 透视变换
flipud: 0.0                   # 上下翻转概率
fliplr: 0.5                   # 左右翻转概率
mosaic: 1.0                   # Mosaic 增强概率
mixup: 0.1                    # MixUp 增强概率
copy_paste: 0.1               # Copy-Paste 增强概率

# 验证
val: true                     # 启用验证
split: 0.2                    # 验证集比例 (0.0-1.0)
save_period: 10               # 每隔多少轮保存一次

# 关键点配置
kpt_shape: [17, 3]            # [关键点数量, 维度(x,y,visibility)]
flip_idx: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15]  # 左右翻转索引

# 类别
names:
  0: person
