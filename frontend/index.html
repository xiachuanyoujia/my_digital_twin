<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Digital Twin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a2e; }
    #app { width: 100vw; height: 100vh; }

    #status {
      position: fixed; top: 16px; left: 16px;
      color: #fff; font-family: monospace; font-size: 13px;
      background: rgba(0,0,0,0.6); padding: 8px 14px;
      border-radius: 6px; pointer-events: none; z-index: 10;
    }
    #status.connected { color: #4ade80; }
    #status.disconnected { color: #f87171; }

    #camera-preview {
      position: fixed; top: 50px; left: 16px;
      width: 280px; height: 210px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      overflow: hidden;
      z-index: 10;
      background: #000;
    }
    #camera-preview video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: none;
    }
    #camera-preview canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #camera-preview .label {
      position: absolute; bottom: 4px; left: 6px;
      color: #fff; font-family: monospace; font-size: 10px;
      background: rgba(0,0,0,0.5); padding: 2px 6px;
      border-radius: 3px; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="status" class="disconnected">后端: 未连接</div>

  <div id="camera-preview">
    <video id="cam-video" autoplay playsinline></video>
    <canvas id="cam-overlay"></canvas>
    <span class="label">摄像头</span>
  </div>

  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
