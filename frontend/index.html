<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Digital Twin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a2e; }
    #app { width: 100vw; height: 100vh; }
    #status {
      position: fixed; top: 16px; left: 16px;
      color: #fff; font-family: monospace; font-size: 13px;
      background: rgba(0,0,0,0.6); padding: 8px 14px;
      border-radius: 6px; pointer-events: none; z-index: 10;
    }
    #status.connected { color: #4ade80; }
    #status.disconnected { color: #f87171; }
  </style>
</head>
<body>
  <div id="status" class="disconnected">Backend: Disconnected</div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
